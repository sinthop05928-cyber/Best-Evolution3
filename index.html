<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Beast Evolution</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    background:linear-gradient(#102b18,#163d27);
    color:white;
    overflow:auto;
    padding:15px;
}

.title{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin:10px;
}

.subtitle{
    text-align:center;
    color:#d8ffe1;
}

.races{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    max-width:700px;
    margin:auto;
}

.race{
    border:2px solid #ffffff30;
    border-radius:18px;
    padding:12px;
    background:#ffffff18;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.race.selected{
    border-color:#ffd600;
    background:#ffd60025;
}

.race .icon{
    font-size:35px;
    display:block;
}

#evolution{
    max-width:700px;
    margin:15px auto;
    background:#07140d;
    border-radius:15px;
    padding:12px;
    text-align:center;
}

#start{
    display:block;
    width:100%;
    max-width:700px;
    margin:auto;
    padding:15px;
    border:0;
    border-radius:15px;
    background:#20c65a;
    color:white;
    font-size:20px;
    font-weight:bold;
}

#hud{
    display:none;
    position:fixed;
    z-index:5;
    top:8px;
    left:8px;
    right:8px;
    color:white;
    pointer-events:none;
    gap:6px;
    flex-wrap:wrap;
}

.hudBox{
    background:#07100ddd;
    padding:7px 10px;
    border-radius:10px;
    font-weight:bold;
}

.hpOuter{
    display:inline-block;
    width:100px;
    height:12px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
}

#hpBar{
    display:block;
    width:100%;
    height:100%;
    background:#20e060;
}

#joystick{
    display:none;
    position:fixed;
    z-index:10;
    left:18px;
    bottom:18px;
    width:135px;
    height:135px;
    border-radius:50%;
    background:#ffffff18;
    border:2px solid #ffffff55;
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    left:38px;
    top:38px;
    border-radius:50%;
    background:#ffffffaa;
}

.gameButton{
    display:none;
    position:fixed;
    z-index:10;
    border:0;
    border-radius:50%;
    color:white;
    font-weight:bold;
}

#jump{
    width:85px;
    height:85px;
    right:18px;
    bottom:18px;
    background:#f59e0b;
}

#attack{
    width:72px;
    height:72px;
    right:120px;
    bottom:25px;
    background:#e53935;
}

#skill{
    width:70px;
    height:70px;
    right:30px;
    bottom:120px;
    background:#8b5cf6;
}

#message{
    display:none;
    position:fixed;
    z-index:15;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    background:#000c;
    color:white;
    padding:10px 15px;
    border-radius:12px;
}

#death{
    display:none;
    position:fixed;
    z-index:30;
    inset:0;
    background:#000b;
    align-items:center;
    justify-content:center;
    color:white;
}

.deathBox{
    background:#202020;
    padding:30px;
    border-radius:20px;
    text-align:center;
}

#respawn{
    border:0;
    padding:12px 25px;
    border-radius:12px;
    background:#20c65a;
    color:white;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="menu">

    <div class="title">
        🧬 BEAST EVOLUTION
    </div>

    <div class="subtitle">
        เลือกเผ่าพันธุ์ก่อนเริ่มเกม
    </div>

    <br>

    <div id="races" class="races"></div>

    <div id="evolution"></div>

    <button id="start">
        ▶️ เริ่มเกม

</div>


<div id="hud">

    <div class="hudBox" id="animal">
        🐯 เสือ
    </div>

    <div class="hudBox">
        ⭐ XP <span id="xp">0</span>
    </div>

    <div class="hudBox">
        🆙 Lv.<span id="level">1</span>
    </div>

    <div class="hudBox">
        ❤️
        <span class="hpOuter">
            <span id="hpBar"></span>
        </span>
    </div>

    <div class="hudBox" id="biome">

    </div>

    <div class="hudBox">

    </div>

</div>


<div id="joystick">
    <div id="stick"></div>
</div>


<button id="attack" class="gameButton">
    ⚔️
    <br>
    โจมตี
</button>


<button id="skill" class="gameButton">
    ✨
    <br>
    สกิล
</button>


<button id="jump" class="gameButton">
    ⬆️
    <br>
    กระโดด
</button>


<div id="message"></div>


<div id="death">

    <div class="deathBox">

        <h1>💀 ตายแล้ว</h1>

        <p>
            เลือดหมด
        </p>

        <button id="respawn">
            🔄 เกิดใหม่
        </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =====================================================
   ข้อมูลเผ่าพันธุ์
===================================================== */

const RACES = {

        icon:"🐾",
        name:"สัตว์เลี้ยงลูกด้วยนม",
        animals:[

            ["🐶","หมา"],
            ["🐷","หมู"],

            ["🦁","สิงโต"],
            ["🦇","ค้างคาวมีขา"]
        ]
    },

    aquatic:{

        name:"สัตว์น้ำ",
        animals:[

            ["🗡️","ปลาดาบ"],
            ["🐟","ปลาปิรันยา"],
            ["🦈","ฉลาม"],
            ["🐙","ปลาหมึกยักษ์"]
        ]
    },

    reptile:{

        name:"สัตว์เลื้อยคลาน",
        animals:[
            ["🐍","งูเล็ก"],
            ["🐛","ตะขาบ"],
            ["🦂","แมงป่อง"],
            ["🐊","อัลลิเกเตอร์"],
            ["🐊","จระเข้"],
            ["🦂","แมงป่องยักษ์"]
        ]
    },

    arctic:{
        icon:"❄️",
        name:"ขั้วโลก",
        animals:[
            ["🐧","เพนกวิน"],
            ["🦭","แมวน้ำ"],
            ["🐋","พะยูน"],
            ["🐻‍❄️","หมีขั้วโลก"],
            ["👹","เยติ"]
        ]
    },

    wild:{
        icon:"🌳",
        name:"สัตว์ป่า",
        animals:[
            ["🐈","แมวป่า"],
            ["🐺","หมาป่า"],
            ["🐗","หมูป่า"],
            ["🦛","ฮิปโป"],
            ["🦏","แรตมีเขา"],
            ["🐯","เสือ"]
        ]

};


/* =====================================================
   ตัวแปรเกม
===================================================== */

let selectedRace = "wild";

let evolutionStage = 0;

let xp = 0;

let level = 1;

let hp = 100;

let maxHP = 100;

let gameStarted = false;

let velocityY = 0;

let grounded = true;

let joystickX = 0;

let joystickY = 0;

let cameraYaw = 0;

let cameraPitch = 0.55;

let cameraDragging = false;

let lastTouchX = 0;

let lastTouchY = 0;

let socket = null;

let myID = null;

let otherPlayers = {};

let otherMeshes = {};


/* =====================================================
   THREE.JS
===================================================== */

let scene;

let camera;

let renderer;

let player;

let world;


/* =====================================================
   สีสัตว์
===================================================== */

const ANIMAL_COLORS = {

    "แมงมุม":0x333333,
    "แมว":0xdd9955,
    "หมา":0x9b6b43,
    "หมู":0xf39ab0,
    "หมี":0x633d20,
    "สิงโต":0xd69a25,
    "ค้างคาวมีขา":0x30253f,

    "ปลา":0x4ca7e8,
    "ปลาดาบ":0x6d9dbd,
    "ปลาปิรันยา":0xd94a4a,
    "ฉลาม":0x71889b,
    "ปลาหมึกยักษ์":0x934ca3,

    "งูเล็ก":0x48a447,
    "ตะขาบ":0xb04a32,
    "แมงป่อง":0x442b27,
    "อัลลิเกเตอร์":0x4d8d48,
    "จระเข้":0x315d38,
    "แมงป่องยักษ์":0x351d19,

    "เพนกวิน":0x222222,
    "แมวน้ำ":0x778b92,
    "พะยูน":0x8ca6a5,
    "หมีขั้วโลก":0xffffff,
    "เยติ":0xdbeeff,

    "แมวป่า":0xb97643,
    "หมาป่า":0x777d86,
    "หมูป่า":0x63442c,
    "ฮิปโป":0x806b79,
    "แรตมีเขา":0x685142,
    "เสือ":0xe58b24
};


/* =====================================================
   เลือกเผ่าพันธุ์
===================================================== */

const raceContainer = document.getElementById("races");

for(const raceKey in RACES){

    const race = RACES[raceKey];

    const button = document.createElement("button");

    button.className = "race";

    button.innerHTML = `
        <span class="icon">${race.icon}</span>
        ${race.name}
    `;

    if(raceKey === selectedRace){

        button.classList.add("selected");

    }

    button.onclick = function(){

        selectedRace = raceKey;

        document
            .querySelectorAll(".race")
            .forEach(x => x.classList.remove("selected"));

        button.classList.add("selected");

        evolutionStage = 0;

        showEvolution();

    };

    raceContainer.appendChild(button);
}


/* =====================================================
   แสดงวิวัฒนาการ
===================================================== */

function showEvolution(){

    const race = RACES[selectedRace];

    let html = `
        <b>🧬 สายวิวัฒนาการ</b>
        <br><br>
    `;

    race.animals.forEach((animal,index)=>{

        html += `
            ${animal[0]} ${animal[1]}
        `;

        if(index < race.animals.length-1){

            html += " ➜ ";

        }

    });

    html += `
        <br><br>
        ✨ ขั้นที่ 2 ขึ้นไปมีสกิล
        <br>
        🏆 ขั้นสุดท้ายมี 2 สกิล
    `;

    document.getElementById("evolution").innerHTML = html;
}

showEvolution();


/* =====================================================
   สร้างโมเดล 3D สัตว์
===================================================== */

function createAnimalModel(name, scale=1){

    const group = new THREE.Group();

    const material =
        new THREE.MeshStandardMaterial({
            color:ANIMAL_COLORS[name] || 0xffffff
        });


    /* ตัว */

    const body =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.8,
                16,
                10
            ),
            material
        );

    body.scale.set(
        1.3,
        0.8,
        1.6
    );

    group.add(body);


    /* หัว */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.55,
                16,
                10
            ),
            material
        );

    head.position.set(
        0,
        0.2,
        -1.15
    );

    group.add(head);


    /* ขา */

    for(let i=0;i<4;i++){

        const leg =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.22,
                    0.8,
                    0.22
                ),
                material
            );

        leg.position.set(

            i % 2 === 0
                ? -0.45
                : 0.45,

            -0.7,

            i < 2
                ? -0.55
                : 0.55

        );

        group.add(leg);

    }


    /* ตา */

    const eyeMaterial =
        new THREE.MeshBasicMaterial({
            color:0x000000
        });

    for(const x of [-0.18,0.18]){

        const eye =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    0.07,
                    8,
                    8
                ),
                eyeMaterial
            );

        eye.position.set(
            x,
            0.3,
            -1.62
        );

        group.add(eye);

    }


    group.scale.setScalar(scale);

    return group;
}


/* =====================================================
   สร้างพื้น
===================================================== */

function makeGround(x,z,size,color){

    const ground =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                size,
                size
            ),

            new THREE.MeshStandardMaterial({
                color:color
            })

        );

    ground.rotation.x = -Math.PI/2;

    ground.position.set(
        x,
        0,
        z
    );

    world.add(ground);

}


/* =====================================================
   สร้างกล่อง / ภูเขา / สิ่งก่อสร้าง
===================================================== */

function makeCube(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    color
){

    const object =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                sx,
                sy,
                sz
            ),

            new THREE.MeshStandardMaterial({
                color:color
            })

        );

    object.position.set(
        x,
        y,
        z
    );

    world.add(object);

    return object;
}


/* =====================================================
   สร้างโลก
===================================================== */

function createWorld(){

    /*
      ป่าดิบ
    */

    makeGround(
        -50,
        -50,
        100,
        0x3c873e
    );


    /*
      มหาสมุทร
    */

    makeGround(
        50,
        -50,
        100,
        0x258db8
    );


    /*
      ขั้วโลก
    */

    makeGround(
        -50,
        50,
        100,
        0xe5f5ff
    );


    /*
      หนองน้ำ
    */

    makeGround(
        50,
        50,
        100,
        0x4f7443
    );


    /*
      ทะเลทราย
    */

    makeGround(
        50,
        -150,
        100,
        0xd2ad61
    );


    /*
      ภูเขาไฟ
    */

    makeGround(
        -50,
        -150,
        100,
        0x522b22
    );


    /*
      เกาะมหาสมุทร
    */

    for(let i=0;i<3;i++){

        const island =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    9,
                    12,
                    2,
                    20
                ),

                new THREE.MeshStandardMaterial({
                    color:0x67a548
                })

            );

        island.position.set(
            25+i*20,
            1,
            -50+i*10
        );

        world.add(island);

    }


    /*
      พีระมิด
    */

    const pyramid =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                17,
                22,
                4
            ),

            new THREE.MeshStandardMaterial({
                color:0xd3a44e
            })

        );

    pyramid.position.set(
        50,
        11,
        -150
    );

    pyramid.rotation.y =
        Math.PI/4;

    world.add(pyramid);


    /*
      ภูเขาไฟขนาดใหญ่
    */

    const volcano =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                25,
                45,
                32
            ),

            new THREE.MeshStandardMaterial({
                color:0x40302d
            })

        );

    volcano.position.set(
        -50,
        22,
        -150
    );

    world.add(volcano);


    /*
      บ่อลาวา
    */

    const lava =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                8,
                8,
                0.4,
                32
            ),

            new THREE.MeshBasicMaterial({
                color:0xff3c00
            })

        );

    lava.position.set(
        -50,
        44,
        -150
    );

    world.add(lava);


    /*
      แม่น้ำเชื่อมมหาสมุทร
    */

    const river =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                14,
                0.1,
                100
            ),

            new THREE.MeshStandardMaterial({
                color:0x168dbe
            })

        );

    river.position.set(
        0,
        0.05,
        50
    );

    world.add(river);


    /*
      ภูเขาขั้วโลก
    */

    for(let i=0;i<5;i++){

        const snow =
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    6,
                    12,
                    6
                ),

                new THREE.MeshStandardMaterial({
                    color:0xf1fbff
                })

            );

        snow.position.set(
            -90+i*10,
            6,
            70
        );

        world.add(snow);

    }


    /*
      บ้านหิมะ
    */

    const snowHouse =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                6,
                16,
                8,
                0,
                Math.PI*2,
                0,
                Math.PI/2
            ),

            new THREE.MeshStandardMaterial({
                color:0xffffff
            })

        );

    snowHouse.position.set(
        -50,
        0,
        50
    );

    world.add(snowHouse);


    /*
      ต้นไม้
    */

    for(let i=0;i<30;i++){

        const x =
            -95 + Math.random()*190;

        const z =
            -95 + Math.random()*190;

        makeCube(
            x,
            2,
            z,
            2,
            4,
            2,
            0x704421
        );

    }

}


/* =====================================================
   สร้างเกม
===================================================== */

function initGame(){

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x82b979
        );


    camera =
        new THREE.PerspectiveCamera(
            60,
            innerWidth/innerHeight,
            0.1,
            500
        );


    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled = true;

    document
        .getElementById("game")
        ?.appendChild(renderer.domElement);


    document.body.appendChild(
        renderer.domElement
    );


    const light =
        new THREE.HemisphereLight(
            0xffffff,
            0x304030,
            1.5
        );

    scene.add(light);


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    sun.position.set(
        60,
        100,
        40
    );

    scene.add(sun);


    world =
        new THREE.Group();

    scene.add(world);

    createWorld();

    createPlayer();

    connectServer();

    animate();

}


/* =====================================================
   ผู้เล่น
===================================================== */

function createPlayer(){

    if(player){

        scene.remove(player);

    }

    player =
        new THREE.Group();

    const animal =
        RACES[selectedRace]
            .animals[evolutionStage][1];

    player.add(
        createAnimalModel(
            animal,
            1.25
        )
    );

    player.position.set(
        0,
        1,
        0
    );

    scene.add(player);

    updateHUD();

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    const animal =
        RACES[selectedRace]
            .animals[evolutionStage];

    document.getElementById("animal")
        .textContent =
        animal[0]+" "+animal[1];

    document.getElementById("xp")
        .textContent = xp;

    document.getElementById("level")
        .textContent = level;

    document.getElementById("hpBar")
        .style.width =
        Math.max(
            0,
            hp/maxHP*100
        )+"%";

}


/* =====================================================
   ไบโอม
===================================================== */

function getBiome(){

    const x = player.position.x;

    const z = player.position.z;


    if(z < -100){

        return {
            name:"🏜️ ทะเลทราย",
            water:false
        };

    }


    if(x < -10 && z < -100){

        return {
            name:"🌋 ภูเขาไฟ",
            water:false
        };

    }


    if(x > 0 && z < 0){

        return {
            name:"🌊 มหาสมุทร",
            water:true
        };

    }


    if(x < 0 && z >= 0){

        return {
            name:"❄️ ขั้วโลก",
            water:false
        };

    }


    if(x >= 0 && z >= 0){

        return {
            name:"🐊 หนองน้ำ",
            water:true
        };

    }


    return {
        name:"🌳 ป่าดิบ",
        water:false
    };

}


/* =====================================================
   ความเร็ว
===================================================== */

function getSpeed(){

    const animal =
        RACES[selectedRace]
            .animals[evolutionStage][1];

    const aquaticAnimals = [

        "ปลา",
        "ปลาดาบ",
        "ปลาปิรันยา",
        "ฉลาม",
        "ปลาหมึกยักษ์",
        "แมวน้ำ",
        "พะยูน"

    ];

    const isAquatic =
        aquaticAnimals.includes(
            animal
        );

    const biome =
        getBiome();


    /*
      สัตว์น้ำในน้ำเร็ว
    */

    if(
        isAquatic &&
        biome.water
    ){

        return 0.18;

    }


    /*
      สัตว์น้ำบนบกช้า
    */

    if(
        isAquatic &&
        !biome.water
    ){

        return 0.06;

    }


    /*
      สัตว์บกในน้ำช้า
    */

    if(
        !isAquatic &&
        biome.water
    ){

        return 0.045;

    }


    return 0.10;

}


/* =====================================================
   เดิน
===================================================== */

function updateMovement(){

    if(!gameStarted) return;


    const forwardX =
        Math.sin(cameraYaw);

    const forwardZ =
        -Math.cos(cameraYaw);

    const rightX =
        Math.cos(cameraYaw);

    const rightZ =
        Math.sin(cameraYaw);


    let dx =
        forwardX*joystickY +
        rightX*joystickX;

    let dz =
        forwardZ*joystickY +
        rightZ*joystickX;


    const speed =
        getSpeed();


    player.position.x +=
        dx*speed;

    player.position.z +=
        dz*speed;


    if(
        Math.abs(dx)+Math.abs(dz)
        >0.05
    ){

        /*
          หันหน้าไปทางที่เดิน
        */

        player.rotation.y =
            Math.atan2(
                dx,
                dz
            );

    }


    /*
      จำกัดขอบเขต
    */

    player.position.x =
        Math.max(
            -96,
            Math.min(
                96,
                player.position.x
            )
        );

    player.position.z =
        Math.max(
            -196,
            Math.min(
                196,
                player.position.z
            )
        );


    /*
      กระโดด
    */

    player.position.y +=
        velocityY;

    velocityY -=
        0.012;


    if(
        player.position.y <= 1
    ){

        player.position.y = 1;

        velocityY = 0;

        grounded = true;

    }


    /*
      ลาวาทำดาเมจ
    */

    if(
        player.position.distanceTo(
            new THREE.Vector3(
                -50,
                1,
                -150
            )
        ) < 12
    ){

        damagePlayer(2);

    }


    /*
      HUD ไบโอม
    */

    document.getElementById(
        "biome"
    ).textContent =
        getBiome().name;


    sendPosition();

}


/* =====================================================
   กระโดด
===================================================== */

function jump(){

    if(!grounded) return;

    velocityY =
        0.24;

    grounded =
        false;

}


/* =====================================================
   ดาเมจ
===================================================== */

function damagePlayer(amount){

    hp -= amount;

    if(hp <= 0){

        hp = 0;

        updateHUD();

        die();

        return;

    }

    updateHUD();

}


/* =====================================================
   ตาย
===================================================== */

function die(){

    gameStarted =
        false;

    document.getElementById(
        "death"
    ).style.display =
        "flex";

}


/* =====================================================
   เกิดใหม่
===================================================== */

document.getElementById(
    "respawn"
).onclick = function(){

    hp = maxHP;

    xp = 0;

    level = 1;

    evolutionStage = 0;

    player.position.set(
        0,
        1,
        0
    );

    document.getElementById(
        "death"
    ).style.display =
        "none";

    gameStarted =
        true;

    updateHUD();

};


/* =====================================================
   โจมตี
===================================================== */

function attack(){

    showMessage(
        "⚔️ "+getAnimalName()+" โจมตี!"
    );

    sendAction(
        "attack"
    );

}


/* =====================================================
   สกิล
===================================================== */

function skill(){

    if(evolutionStage === 0){

        showMessage(
            "🔒 วิวัฒนาการก่อนจึงจะมีสกิล"
        );

        return;

    }


    const animal =
        getAnimalName();


    if(
        evolutionStage ===
        RACES[selectedRace].animals.length-1
    ){

        showMessage(
            "✨ "+animal+
            " ใช้สกิลพิเศษ 2 สกิล!"
        );

    }else{

        showMessage(
            "✨ "+animal+
            " ใช้สกิล!"
        );

    }


    sendAction(
        "skill"
    );

}


/* =====================================================
   ชื่อสัตว์
===================================================== */

function getAnimalName(){

    return RACES[selectedRace]
        .animals[evolutionStage][1];

}


/* =====================================================
   ข้อความ
===================================================== */

function showMessage(text){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent =
        text;

    box.style.display =
        "block";

    clearTimeout(
        showMessage.timer
    );

    showMessage.timer =
        setTimeout(
            ()=>{
                box.style.display =
                    "none";
            },
            1500
        );

}


/* =====================================================
   ปุ่มโจมตี
===================================================== */

document.getElementById(
    "attack"
).onclick = attack;


/* =====================================================
   ปุ่มสกิล
===================================================== */

document.getElementById(
    "skill"
).onclick = skill;


/* =====================================================
   ปุ่มกระโดด
===================================================== */

document.getElementById(
    "jump"
).onclick = jump;


/* =====================================================
   JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );


let joystickActive =
    false;


joystick.addEventListener(
    "pointerdown",
    function(event){

        joystickActive =
            true;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event
        );

    }
);


joystick.addEventListener(
    "pointermove",
    function(event){

        if(!joystickActive)
            return;

        updateJoystick(
            event
        );

    }
);


joystick.addEventListener(
    "pointerup",
    resetJoystick
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


function updateJoystick(event){

    const rect =
        joystick.getBoundingClientRect();

    let x =
        event.clientX -
        rect.left -
        rect.width/2;

    let y =
        event.clientY -
        rect.top -
        rect.height/2;


    const max =
        45;

    const distance =
        Math.sqrt(
            x*x+y*y
        );


    if(distance > max){

        x =
            x/distance*max;

        y =
            y/distance*max;

    }


    joystickX =
        x/max;

    joystickY =
        -y/max;


    stick.style.transform =
        `translate(${x}px,${y}px)`;

}


function resetJoystick(){

    joystickActive =
        false;

    joystickX = 0;

    joystickY = 0;

    stick.style.transform =
        "translate(0,0)";

}


/* =====================================================
   หมุนกล้องด้วยการลากหน้าจอ
===================================================== */

window.addEventListener(
    "pointerdown",
    function(event){

        if(
            event.clientX >
            innerWidth*0.35
        ){

            cameraDragging =
                true;

            lastTouchX =
                event.clientX;

            lastTouchY =
                event.clientY;

        }

    }
);


window.addEventListener(
    "pointermove",
    function(event){

        if(!cameraDragging)
            return;


        const dx =
            event.clientX -
            lastTouchX;

        const dy =
            event.clientY -
            lastTouchY;


        cameraYaw -=
            dx*0.008;

        cameraPitch +=
            dy*0.006;


        cameraPitch =
            Math.max(
                0.15,
                Math.min(
                    1.1,
                    cameraPitch
                )
            );


        lastTouchX =
            event.clientX;

        lastTouchY =
            event.clientY;

    }
);


window.addEventListener(
    "pointerup",
    function(){

        cameraDragging =
            false;

    }
);


/* =====================================================
   Multiplayer
===================================================== */

function connectServer(){

    try{

        const protocol =
            location.protocol === "https:"
            ? "wss"
            : "ws";


        const url =
            protocol+
            "://"+
            location.host;


        socket =
            new WebSocket(
                url
            );


        socket.onopen =
            function(){

                showMessage(
                    "🟢 เชื่อมต่อ Multiplayer แล้ว"
                );

            };


        socket.onmessage =
            function(event){

                let data;

                try{

                    data =
                        JSON.parse(
                            event.data
                        );

                }catch{

                    return;

                }


                if(
                    data.type ===
                    "welcome"
                ){

                    myID =
                        data.id;

                }


                if(
                    data.type ===
                    "state"
                ){

                    otherPlayers =
                        data.players ||
                        {};

                    updateOtherPlayers();

                    document.getElementById(
                        "playerCount"
                    ).textContent =
                        Object.keys(
                            otherPlayers
                        ).length;

                }


                if(
                    data.type ===
                    "message"
                ){

                    showMessage(
                        data.text
                    );

                }

            };


        socket.onclose =
            function(){

                showMessage(
                    "🔴 Multiplayer หลุดการเชื่อมต่อ"
                );

            };

    }catch(error){

        console.log(
            "WebSocket error",
            error
        );

    }

}


/* =====================================================
   ส่งตำแหน่งให้ Server
===================================================== */

function sendPosition(){

    if(
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ){

        return;

    }


    socket.send(
        JSON.stringify({

            type:"move",

            x:player.position.x,

            y:player.position.y,

            z:player.position.z,

            rot:player.rotation.y,

            animal:getAnimalName(),

            race:selectedRace

        })
    );

}


/* =====================================================
   ส่งคำสั่ง
===================================================== */

function sendAction(action){

    if(
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ){

        return;

    }


    socket.send(
        JSON.stringify({
            type:action
        })
    );

}


/* =====================================================
   แสดงผู้เล่นคนอื่น
===================================================== */

function updateOtherPlayers(){

    for(
        const id in otherPlayers
    ){

        if(id === myID)
            continue;


        const data =
            otherPlayers[id];


        if(
            !otherMeshes[id]
        ){

            otherMeshes[id] =
                createAnimalModel(
                    data.animal ||
                    "แมว",
                    1
                );

            scene.add(
                otherMeshes[id]
            );

        }


        const mesh =
            otherMeshes[id];


        mesh.position.set(
            data.x,
            data.y,
            data.z
        );


        mesh.rotation.y =
            data.rot || 0;

    }


    /*
      ลบผู้เล่นที่ออกจากเกม
    */

    for(
        const id in otherMeshes
    ){

        if(
            !otherPlayers[id]
        ){

            scene.remove(
                otherMeshes[id]
            );

            delete otherMeshes[id];

        }

    }

}


/* =====================================================
   กล้อง
===================================================== */

function updateCamera(){

    if(!player)
        return;


    const distance =
        10;


    camera.position.set(

        player.position.x +
        Math.sin(cameraYaw) *
        distance *
        Math.cos(cameraPitch),

        player.position.y +
        3 +
        Math.sin(cameraPitch) *
        distance,

        player.position.z +
        Math.cos(cameraYaw) *
        distance *
        Math.cos(cameraPitch)

    );


    camera.lookAt(

        player.position.x,

        player.position.y+1,

        player.position.z

    );

}


/* =====================================================
   เริ่มเกม
===================================================== */

document.getElementById(
    "start"
).onclick = function(){

    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "hud"
    ).style.display =
        "flex";


    document.getElementById(
        "joystick"
    ).style.display =
        "block";


    document
        .querySelectorAll(
            ".gameButton"
        )
        .forEach(
            button =>
            button.style.display =
            "block"
        );


    gameStarted =
        true;


    initGame();

};


/* =====================================================
   Game Loop
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    updateMovement();

    updateCamera();

    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   หน้าจอ
===================================================== */

window.addEventListener(
    "resize",
    function(){

        if(!camera)
            return;


        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>
