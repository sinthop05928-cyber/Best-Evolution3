<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,
      maximum-scale=1,user-scalable=no">

<title>Beast Evolution 3D</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
}

#game{
    position:fixed;
    inset:0;
}

/* ================= MENU ================= */

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    background:
        linear-gradient(
            rgba(0,0,0,.65),
            rgba(0,0,0,.9)
        );
    display:flex;
    justify-content:center;
    align-items:center;
}

.panel{
    width:94%;
    max-width:700px;
    max-height:92vh;
    overflow:auto;
    padding:20px;
    border-radius:25px;
    background:#17243a;
    color:white;
}

h1{
    text-align:center;
}

.races{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.race{
    border:0;
    padding:15px;
    border-radius:16px;
    color:white;
    font-weight:bold;
    font-size:15px;
}

.race span{
    display:block;
    font-size:35px;
}

.race.selected{
    outline:4px solid #ffd700;
}

#evolution{
    margin-top:15px;
    padding:10px;
    background:#0c1524;
    border-radius:15px;
    overflow:auto;
}

.evoRow{
    display:flex;
    gap:8px;
}

.evo{
    min-width:90px;
    padding:8px;
    background:#ffffff12;
    border-radius:12px;
    text-align:center;
}

.evoIcon{
    font-size:30px;
}

#start{
    width:100%;
    padding:16px;
    border:0;
    border-radius:15px;
    margin-top:15px;
    background:#22c55e;
    color:white;
    font-size:18px;
    font-weight:bold;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:5;
    display:none;
    color:white;
    gap:7px;
    justify-content:space-between;
    pointer-events:none;
    flex-wrap:wrap;
}

.box{
    background:#101827dd;
    padding:8px 10px;
    border-radius:12px;
    font-weight:bold;
}

#hpOuter{
    width:120px;
    height:12px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
}

#hpInner{
    width:100%;
    height:100%;
    background:#22c55e;
}

/* ================= JOYSTICK ================= */

#joystick{
    position:fixed;
    z-index:10;
    left:18px;
    bottom:20px;
    width:135px;
    height:135px;
    border-radius:50%;
    background:#ffffff20;
    border:2px solid #ffffff40;
    display:none;
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    left:38px;
    top:38px;
    border-radius:50%;
    background:#ffffff90;
}

/* ================= BUTTONS ================= */

.gameButton{
    position:fixed;
    z-index:10;
    border:0;
    border-radius:50%;
    color:white;
    font-weight:bold;
    display:none;
}

#jump{
    right:20px;
    bottom:25px;
    width:90px;
    height:90px;
    background:#f59e0b;
}

#attack{
    right:125px;
    bottom:35px;
    width:75px;
    height:75px;
    background:#ef4444;
}

#skill{
    right:35px;
    bottom:135px;
    width:72px;
    height:72px;
    background:#8b5cf6;
}

/* ================= CAMERA ================= */

#cameraHint{
    position:fixed;
    right:15px;
    top:85px;
    z-index:5;
    color:white;
    background:#0008;
    padding:7px 10px;
    border-radius:12px;
    display:none;
    font-size:12px;
}

/* ================= MESSAGE ================= */

#message{
    position:fixed;
    z-index:15;
    top:75px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 15px;
    border-radius:15px;
    background:#111827ee;
    color:white;
    display:none;
    white-space:nowrap;
}

/* ================= DEATH ================= */

#deathScreen{
    position:fixed;
    inset:0;
    z-index:30;
    background:#000c;
    display:none;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;
}

.deathBox{
    background:#1b2435;
    padding:30px;
    border-radius:25px;
}

#restart{
    border:0;
    padding:14px 30px;
    border-radius:14px;
    background:#22c55e;
    color:white;
    font-size:18px;
}
</style>
</head>

</div>

<!-- ================= CONTROLS ================= -->

<div id="joystick">

</div>

<button id="jump" class="gameButton">

</button>

</div>

const COLORS={

/* =========================================================

========================================================= */

/* =========================================================
   MODEL
========================================================= */

function createAnimalModel(
    name,
    color=0xffffff,
    scale=1
){

    const group=
    new THREE.Group();

    const mat=
    new THREE.MeshStandardMaterial({
        color:color
    });

    const body=
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .8,8,6
        ),
        mat
    );

    body.scale.set(
        1.4,.9,1.8
    );

    body.castShadow=true;

    group.add(body);


    const head=
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .55,8,6
        ),
        mat
    );

    head.position.set(
        0,.2,-1.1
    );

    head.castShadow=true;

    group.add(head);


    for(
        let i=0;
        i<4;
        i++
    ){

        const leg=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .25,.8,.25
            ),
            mat
        );

        leg.position.x=
            i%2===0 ? -.45:.45;

        leg.position.z=
            i<2 ? -.55:.55;

        leg.position.y=-.7;

        leg.castShadow=true;

        group.add(leg);

    }


    const tail=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .12,.18,1,6
        ),
        mat
    );

    tail.rotation.x=Math.PI/2;

    tail.position.z=1.25;

    tail.position.y=.1;

    group.add(tail);


    const eyeMat=
    new THREE.MeshBasicMaterial({
        color:0x000000
    });


    [-.18,.18].forEach(
        x=>{

            const eye=
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .07,6,6
                ),
                eyeMat
            );

            eye.position.set(
                x,.35,-1.58
            );

            group.add(eye);

        }
    );


    /* เขาของแรต */

    if(name==="แรตมีเขา"){

        [-.25,.25].forEach(
            x=>{

                const horn=
                new THREE.Mesh(
                    new THREE.ConeGeometry(
                        .15,.65,6
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0xd8d0bd
                    })
                );

                horn.position.set(
                    x,.7,-1.2
                );

                horn.rotation.x=-.3;

                group.add(horn);

            }
        );

    }


    /* แผงคอสิงโต */

    if(name==="สิงโต"){

        const mane=
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .55,.2,8,12
            ),
            new THREE.MeshStandardMaterial({
                color:0x8a4a20
            })
        );

        mane.rotation.x=Math.PI/2;

        mane.position.set(
            0,.25,-1.05
        );

        group.add(mane);

    }


    /* ปีกค้างคาว */

    if(name==="ค้างคาวมีขา"){

        [-1,1].forEach(
            side=>{

                const wing=
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        1.5,1
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x3d294f,
                        side:THREE.DoubleSide
                    })
                );

                wing.position.x=side;

                wing.position.y=.4;

                wing.rotation.y=side*.5;

                group.add(wing);

            }
        );

    }


    group.scale.setScalar(scale);

    return group;
}


/* =========================================================
   PLAYER
========================================================= */

function createPlayer(){

    if(player)
        scene.remove(player);

    const animal=
    RACES[selectedRace]
    .animals[stage][1];

    player=
    new THREE.Group();

    playerModel=
    createAnimalModel(
        animal,
        COLORS[animal]||0xffffff,
        1.3
    );

    player.add(playerModel);

    player.position.set(
        0,1,0
    );

    scene.add(player);
}


/* =========================================================
   BIOME MAP
========================================================= */

/*
   แบ่งแมพเป็น 4 โซนใหญ่
   จากระยะไกลสามารถเห็นสีและภูมิประเทศ
*/

function createBiomeZone(
    x,
    z,
    size,
    biome
){

    const ground=
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            size,size
        ),
        new THREE.MeshStandardMaterial({
            color:BIOMES[biome].color
        })
    );

    ground.rotation.x=-Math.PI/2;

    ground.position.set(
        x,0,z
    );

    ground.receiveShadow=true;

    world.add(ground);


    /*
       ป้ายขนาดใหญ่
       ให้มองเห็นไบโอมจากไกล ๆ
    */

    createBiomeSign(
        x,
        z,
        biome
    );
}


function createBiomeSign(
    x,z,biome
){

    const canvas=
    document.createElement("canvas");

    canvas.width=512;
    canvas.height=128;

    const ctx=
    canvas.getContext("2d");

    ctx.fillStyle=
    "#000000aa";

    ctx.fillRect(
        0,0,512,128
    );

    ctx.fillStyle="white";

    ctx.font="bold 42px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
        BIOMES[biome].name,
        256,64
    );

    const texture=
    new THREE.CanvasTexture(
        canvas
    );

    const sprite=
    new THREE.Sprite(
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        })
    );

    sprite.position.set(
        x,
        10,
        z
    );

    sprite.scale.set(
        18,4.5,1
    );

    world.add(sprite);
}


/* =========================================================
   MAP
========================================================= */

function createMap(){

    /*
       4 โซน
    */

    createBiomeZone(
        -50,-50,
        100,
        "forest"
    );

    createBiomeZone(
        50,-50,
        100,
        "ocean"
    );

    createBiomeZone(
        -50,50,
        100,
        "arctic"
    );

    createBiomeZone(
        50,50,
        100,
        "swamp"
    );


    /*
       ต้นไม้ในป่า
    */

    for(
        let i=0;
        i<70;
        i++
    ){

        const tree=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                1.6,5,7
            ),
            new THREE.MeshStandardMaterial({
                color:0x286b32
            })
        );

        tree.position.set(
            Math.random()*90-95,
            2.5,
            Math.random()*90-95
        );

        world.add(tree);
    }


    /*
       น้ำตก/ภูเขาน้ำแข็งในไบโอม
       เพื่อให้แยกจากระยะไกล
    */

    for(
        let i=0;
        i<25;
        i++
    ){

        const ice=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                2,8,5
            ),
            new THREE.MeshStandardMaterial({
                color:0xd8f7ff
            })
        );

        ice.position.set(
            Math.random()*90-95,
            4,
            Math.random()*90+5
        );

        world.add(ice);

    }
}


/* =========================================================
   ANIMALS
========================================================= */

function spawnAnimals(){

    for(
        let i=0;
        i<55;
        i++
    ){

        const keys=
        Object.keys(RACES);

        const race=
        RACES[
            keys[
                Math.floor(
                    Math.random()*keys.length
                )
            ]
        ];

        const animal=
        race.animals[
            Math.floor(
                Math.random()*
                race.animals.length
            )
        ];

        const model=
        createAnimalModel(
            animal[1],
            COLORS[animal[1]]||0xffffff,
            .9
        );

        model.position.set(
            Math.random()*180-90,
            1,
            Math.random()*180-90
        );

        world.add(model);

        npcs.push({
            model,
            name:animal[1],
            hp:100,
            attackCooldown:0,
            alive:true,
            direction:
                Math.random()*Math.PI*2
        });
    }
}


/* =========================================================
   FOOD
========================================================= */

const FOOD_TYPES=[

{
emoji:"🌱",
name:"หญ้า",
xp:1,
count:100
},

{
emoji:"🍎",
name:"แอปเปิ้ล",
xp:5,
count:50
},

{
emoji:"🥩",
name:"เนื้อสัตว์",
xp:10,
count:30
}

];


function createFood(type){

    const canvas=
    document.createElement("canvas");

    canvas.width=128;
    canvas.height=128;

    const ctx=
    canvas.getContext("2d");

    ctx.font="90px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        type.emoji,
        64,64
    );

    const texture=
    new THREE.CanvasTexture(
        canvas
    );

    const sprite=
    new THREE.Sprite(
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        })
    );

    sprite.scale.set(
        2.2,2.2,1
    );

    return sprite;
}


function spawnFoods(){

    FOOD_TYPES.forEach(
        type=>{

            for(
                let i=0;
                i<type.count;
                i++
            ){

                const object=
                createFood(type);

                object.position.set(
                    Math.random()*180-90,
                    1.4,
                    Math.random()*180-90
                );

                world.add(object);

                foods.push({
                    object,
                    xp:type.xp,
                    name:type.name,
                    emoji:type.emoji,
                    collected:false
                });

            }

        }
    );
}


/* =========================================================
   FOOD COLLECT
========================================================= */

function updateFoods(){

    foods.forEach(
        food=>{

            if(food.collected)
                return;

            const distance=
            food.object.position
            .distanceTo(
                player.position
            );

            if(distance<2.2){

                food.collected=true;

                world.remove(
                    food.object
                );

                addXP(food.xp);

                showMessage(
                    food.emoji+
                    " เก็บ"+
                    food.name+
                    " +"+
                    food.xp+
                    " XP"
                );

            }
        }
    );
}


/* =========================================================
   SPEED
========================================================= */

const AQUATIC=[

"ปลา",
"ปลาดาบ",
"ปลาปิรันยา",
"ฉลาม",
"ปลาหมึกยักษ์",
"แมวน้ำ",
"พะยูน"

];


function getSpeed(){

    const animal=
    RACES[selectedRace]
    .animals[stage][1];

    const aquatic=
    AQUATIC.includes(animal);

    const water=
    currentBiome==="ocean";

    if(aquatic && water)
        return .16;

    if(aquatic && !water)
        return .055;

    if(!aquatic && water)
        return .055;

    return .16;
}


/* =========================================================
   MOVEMENT
========================================================= */

function updatePlayer(){

    if(!playing)
        return;

    const speed=getSpeed();


    /*
       เดินตามทิศที่กล้องหัน
    */

    const forwardX=
    Math.sin(cameraYaw);

    const forwardZ=
    Math.cos(cameraYaw);

    const rightX=
    Math.cos(cameraYaw);

    const rightZ=
    -Math.sin(cameraYaw);


    const dx=
    forwardX*moveZ+
    rightX*moveX;

    const dz=
    forwardZ*moveZ+
    rightZ*moveX;


    player.position.x+=
    dx*speed;

    player.position.z+=
    dz*speed;


    /*
       หันตัวตามทิศเดิน
    */

    if(
        Math.abs(dx)+
        Math.abs(dz)>0.05
    ){

        player.rotation.y=
        Math.atan2(
            dx,
            dz
        );

    }


    /*
       กระโดด
    */

    player.position.y+=
    playerVelocityY;

    playerVelocityY-=.012;


    if(
        player.position.y<=1
    ){

        player.position.y=1;

        playerVelocityY=0;

        playerOnGround=true;
    }


    /*
       จำกัดพื้นที่
    */

    player.position.x=
    THREE.MathUtils.clamp(
        player.position.x,
        -96,96
    );

    player.position.z=
    THREE.MathUtils.clamp(
        player.position.z,
        -96,96
    );


    updateCamera();

    updateBiomeByPosition();
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const distance=11;

    const horizontal=
    Math.cos(cameraPitch)*
    distance;

    camera.position.x=
    player.position.x+
    Math.sin(cameraYaw)*
    horizontal;

    camera.position.z=
    player.position.z+
    Math.cos(cameraYaw)*
    horizontal;

    camera.position.y=
    player.position.y+
    3+
    Math.sin(cameraPitch)*
    distance;

    camera.lookAt(
        player.position.x,
        player.position.y+1,
        player.position.z
    );
}


/* =========================================================
   CAMERA TOUCH
========================================================= */

renderer.domElement
.addEventListener(
    "pointerdown",
    e=>{

        /*
           เฉพาะด้านขวา
        */

        if(
            e.clientX >
            innerWidth*.35
        ){

            cameraTouching=true;

            lastCameraX=e.clientX;
            lastCameraY=e.clientY;

            renderer.domElement
            .setPointerCapture(
                e.pointerId
            );
        }
    }
);


renderer.domElement
.addEventListener(
    "pointermove",
    e=>{

        if(!cameraTouching)
            return;

        const dx=
        e.clientX-lastCameraX;

        const dy=
        e.clientY-lastCameraY;

        lastCameraX=e.clientX;
        lastCameraY=e.clientY;


        cameraYaw-=dx*.008;

        cameraPitch+=dy*.006;


        cameraPitch=
        THREE.MathUtils.clamp(
            cameraPitch,
            .15,
            1.1
        );

    }
);


renderer.domElement
.addEventListener(
    "pointerup",
    ()=>{

        cameraTouching=false;

    }
);


/* =========================================================
   BIOME DETECTION
========================================================= */

function updateBiomeByPosition(){

    const x=player.position.x;
    const z=player.position.z;

    let biome="forest";

    if(x>=0 && z<0)
        biome="ocean";

    if(x<0 && z>=0)
        biome="arctic";

    if(x>=0 && z>=0)
        biome="swamp";


    if(
        biome!==currentBiome
    ){

        currentBiome=biome;

        scene.background=
        new THREE.Color(
            BIOMES[biome].sky
        );

        scene.fog.color.setHex(
            BIOMES[biome].sky
        );

        document
        .getElementById("biome")
        .textContent=
        BIOMES[biome].name;
    }
}


/* =========================================================
   NPC
========================================================= */

function updateNPCs(){

    npcs.forEach(
        npc=>{

            if(!npc.alive)
                return;


            npc.model.position.x+=
            Math.sin(
                Date.now()*.0005+
                npc.model.id
            )*.015;


            npc.model.position.z+=
            Math.cos(
                Date.now()*.0004+
                npc.model.id
            )*.015;


            const distance=
            npc.model.position
            .distanceTo(
                player.position
            );


            if(
                distance<3 &&
                npc.attackCooldown<=0
            ){

                playerHP-=5;

                npc.attackCooldown=70;

                updateHP();

                showMessage(
                    "⚔️ "+
                    npc.name+
                    " โจมตีคุณ!"
                );

                if(playerHP<=0){

                    die();

                }
            }


            if(
                npc.attackCooldown>0
            ){

                npc.attackCooldown--;

            }

        }
    );
}


/* =========================================================
   ATTACK
========================================================= */

function attack(){

    if(!playing)
        return;

    let target=null;
    let min=4;

    npcs.forEach(
        npc=>{

            if(!npc.alive)
                return;

            const d=
            npc.model.position
            .distanceTo(
                player.position
            );

            if(d<min){

                target=npc;
                min=d;

            }
        }
    );


    if(!target){

        showMessage(
            "ไม่มีสัตว์อยู่ใกล้"
        );

        return;
    }


    const damage=
    20+stage*10;

    target.hp-=damage;


    showMessage(
        "⚔️ โจมตี "+
        target.name+
        " -"+
        damage+
        " HP"
    );


    if(target.hp<=0){

        target.alive=false;

        world.remove(
            target.model
        );

        addXP(10);

        showMessage(
            "🏆 ชนะ "+
            target.name+
            " +10 XP"
        );
    }
}


/* =========================================================
   SKILL
========================================================= */

function useSkill(){

    if(stage===0){

        showMessage(
            "🔒 ขั้น 1 ยังไม่มีสกิล"
        );

        return;
    }


    const animal=
    RACES[selectedRace]
    .animals[stage][1];

    const skills=
    SKILLS[animal]||[];


    let target=null;
    let min=9;


    npcs.forEach(
        npc=>{

            if(!npc.alive)
                return;

            const d=
            npc.model.position
            .distanceTo(
                player.position
            );

            if(d<min){

                target=npc;
                min=d;

            }
        }
    );


    if(!target){

        showMessage(
            "ไม่มีเป้าหมาย"
        );

        return;
    }


    const damage=
    35+stage*15;

    target.hp-=damage;


    showMessage(
        skills.join(" + ")+
        " ⚔️ -"+
        damage+
        " HP"
    );


    if(target.hp<=0){

        target.alive=false;

        world.remove(
            target.model
        );

        addXP(15);

    }
}


/* =========================================================
   XP / EVOLUTION
========================================================= */

function requiredXP(){

    return 20+
    stage*20;
}


function addXP(amount){

    xp+=amount;


    while(
        stage<
        RACES[selectedRace]
        .animals.length-1
        &&
        xp>=requiredXP()
    ){

        xp-=requiredXP();

        stage++;

        level=stage+1;

        createPlayer();

        const animal=
        RACES[selectedRace]
        .animals[stage];


        showMessage(
            "🧬 วิวัฒนาการเป็น "+
            animal[1]+"!"
        );

    }


    updateHUD();
}


/* =========================================================
   HP
========================================================= */

function updateHP(){

    document
    .getElementById("hpInner")
    .style.width=
    Math.max(
        0,
        playerHP
    )+"%";


    if(playerHP<40){

        document
        .getElementById("hpInner")
        .style.background=
        "#ef4444";

    }else{

        document
        .getElementById("hpInner")
        .style.background=
        "#22c55e";

    }
}


/* =========================================================
   DEATH
========================================================= */

function die(){

    if(!playing)
        return;

    playing=false;

    document
    .getElementById("deathScreen")
    .style.display=
    "flex";
}


function restartGame(){

    /*
       ล้าง NPC
    */

    npcs.forEach(
        npc=>{
            world.remove(
                npc.model
            );
        }
    );

    npcs.length=0;


    /*
       ล้างอาหาร
    */

    foods.forEach(
        food=>{
            world.remove(
                food.object
            );
        }
    );

    foods.length=0;


    /*
       รีเซ็ต
    */

    xp=0;

    stage=0;

    level=1;

    playerHP=100;

    currentBiome="forest";

    player.position.set(
        0,1,0
    );


    createPlayer();

    spawnAnimals();

    spawnFoods();

    updateHUD();

    document
    .getElementById(
        "deathScreen"
    )
    .style.display=
    "none";


    playing=true;

    showMessage(
        "🔄 เริ่มใหม่แล้ว!"
    );
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    const animal=
    RACES[selectedRace]
    .animals[stage];


    document
    .getElementById("animalName")
    .textContent=
    animal[0]+" "+animal[1];


    document
    .getElementById("xp")
    .textContent=xp;


    document
    .getElementById("level")
    .textContent=level;


    updateHP();
}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(
        playerOnGround &&
        playing
    ){

        playerVelocityY=.24;

        playerOnGround=false;

    }
}


/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
document.getElementById(
    "joystick"
);

const stick=
document.getElementById(
    "stick"
);

let dragging=false;


function joystickMove(e){

    if(!dragging)
        return;


    const rect=
    joystick.getBoundingClientRect();


    let x=
    e.clientX-
    (rect.left+rect.width/2);

    let y=
    e.clientY-
    (rect.top+rect.height/2);


    const max=45;

    const distance=
    Math.hypot(x,y);


    if(distance>max){

        x=x/distance*max;
        y=y/distance*max;

    }


    stick.style.transform=
    `translate(${x}px,${y}px)`;


    moveX=x/max;
    moveZ=y/max;
}


joystick.addEventListener(
    "pointerdown",
    e=>{

        dragging=true;

        joystick.setPointerCapture(
            e.pointerId
        );

        joystickMove(e);
    }
);


joystick.addEventListener(
    "pointermove",
    joystickMove
);


joystick.addEventListener(
    "pointerup",
    ()=>{

        dragging=false;

        moveX=0;
        moveZ=0;

        stick.style.transform=
        "translate(0,0)";
    }
);


/* =========================================================
   BUTTONS
========================================================= */

document
.getElementById("jump")
.onclick=jump;

document
.getElementById("attack")
.onclick=attack;

document
.getElementById("skill")
.onclick=useSkill;

document
.getElementById("restart")
.onclick=restartGame;


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    const el=
    document.getElementById(
        "message"
    );

    el.textContent=text;

    el.style.display="block";

    clearTimeout(
        showMessage.timer
    );

    showMessage.timer=
    setTimeout(
        ()=>{
            el.style.display=
            "none";
        },
        1800
    );
}


/* =========================================================
   MENU
========================================================= */

const raceContainer=
document.getElementById(
    "races"
);


Object.keys(RACES)
.forEach(
    (key,index)=>{

        const race=RACES[key];

        const button=
        document.createElement(
            "button"
        );

        button.className="race";

        button.style.background=[
            "#7146b7",
            "#087da5",
            "#a45b20",
            "#397da4",
            "#248343"
        ][index];

        button.innerHTML=
        `
        <span>${race.icon}</span>
        ${race.name}
        `;

        button.onclick=()=>{

            selectedRace=key;

            stage=0;

            xp=0;

            level=1;


            document
            .querySelectorAll(".race")
            .forEach(
                b=>
                b.classList
                .remove("selected")
            );


            button.classList
            .add("selected");


            showEvolution();
        };


        raceContainer
        .appendChild(button);

    }
);


/* =========================================================
   EVOLUTION MENU
========================================================= */

function showEvolution(){

    const race=
    RACES[selectedRace];

    const box=
    document.getElementById(
        "evolution"
    );


    box.innerHTML=
    "<b>สายวิวัฒนาการ</b>"+
    "<div class='evoRow'>"+
    race.animals
    .map(
        (a,i)=>`

        <div class="evo">

        <div class="evoIcon">
        ${a[0]}
        </div>

        ${a[1]}

        <br>

        <small>
        ${
            i===0
            ?"เริ่มต้น"
            :
            i===race.animals.length-1
            ?"🏆 2 สกิล"
            :"✨ 1 สกิล"
        }
        </small>

        </div>

        `
    )
    .join("")+
    "</div>";
}


/* =========================================================
   START
========================================================= */

document
.getElementById("start")
.onclick=()=>{

    playing=true;

    document
    .getElementById("menu")
    .style.display="none";

    document
    .getElementById("hud")
    .style.display="flex";

    document
    .getElementById("joystick")
    .style.display="block";

    document
    .getElementById("jump")
    .style.display="block";

    document
    .getElementById("attack")
    .style.display="block";

    document
    .getElementById("skill")
    .style.display="block";

    document
    .getElementById("cameraHint")
    .style.display="block";


    createMap();

    createPlayer();

    spawnAnimals();

    spawnFoods();

    updateHUD();

    showMessage(
        "🌱 +1 XP | 🍎 +5 XP | 🥩 +10 XP"
    );
};


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    e=>{

        if(e.key==="w")
            moveZ=1;

        if(e.key==="s")
            moveZ=-1;

        if(e.key==="a")
            moveX=-1;

        if(e.key==="d")
            moveX=1;

        if(e.code==="Space")
            jump();

        if(e.key==="f")
            attack();

        if(e.key==="q")
            useSkill();

    }
);


window.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="w"||
            e.key==="s"
        )
            moveZ=0;

        if(
            e.key==="a"||
            e.key==="d"
        )
            moveX=0;

    }
);


/* =========================================================
   LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(playing){

        updatePlayer();

        updateNPCs();

        updateFoods();

    }


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
        innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   DEFAULT
========================================================= */

document
.querySelector(".race")
?.classList
.add("selected");

showEvolution();

</script>

</html>
